services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    restart: unless-stopped
    privileged: true
    volumes:
      - piston_data:/piston
      - /var/run/docker.sock:/var/run/docker.sock
    # No "ports:" -- not exposed to the outside world, only reachable by
    # other containers on this compose network (i.e. the backend).

  postgres:
    image: postgres:16
    container_name: leetcode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No "ports:" here either -- same reasoning as piston.

  backend:
    build: ./backend
    container_name: leetcode_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PISTON_URL: http://piston:2000
      API_KEY: ${API_KEY}
      FRONTEND_URL: https://${DOMAIN}
    depends_on:
      - postgres
      - piston
    expose:
      - "8000" # reachable by Caddy, not directly by the internet

  frontend:
    build: ./frontend
    container_name: leetcode_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  piston_data:
  postgres_data:
  caddy_data:
  caddy_config: